<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Study Notes</title>
<style>
:root{
  --ground:#F4F7F8; --surface:#FFFFFF; --surface-2:#EDF2F4;
  --ink:#0E171D; --muted:#5C6E79; --line:#D8E1E6;
  --accent:#0B5E8A; --accent-soft:#E2EEF5;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --side:300px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1317; --surface:#131E24; --surface-2:#1A272E;
    --ink:#E4ECF1; --muted:#8AA0AC; --line:#2A3B44;
    --accent:#4FA6DC; --accent-soft:#152A38;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1317; --surface:#131E24; --surface-2:#1A272E;
  --ink:#E4ECF1; --muted:#8AA0AC; --line:#2A3B44;
  --accent:#4FA6DC; --accent-soft:#152A38;
}
*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:light dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* sidebar */
aside{width:var(--side);flex:none;height:100%;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand a{color:inherit;text-decoration:none}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand strong{font-size:19px}
.search{margin:12px 14px 6px;padding:7px 10px;width:calc(100% - 28px);border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
nav{flex:1;overflow-y:auto;padding:6px 8px 20px}
.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 4px}
.grp.sub{font-size:10.5px;letter-spacing:.1em;color:var(--accent);padding:8px 10px 2px 18px}
.subj.in>button{padding-left:20px}
.grp-h.sub{font-size:11px;color:var(--accent);margin-top:2px}
.grp-h{grid-column:1/-1;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.subj{margin:4px 0}
.subj>button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:5px;text-align:left;font-weight:650}
.subj>button:hover{background:var(--surface-2)}
.subj>button .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.subj.open>button .chev{transform:rotate(90deg)}
.dot{width:10px;height:10px;border-radius:2px;flex:none}
.subj ol{list-style:none;margin:0 0 6px;padding:0 0 0 14px;display:none}
.subj.open ol{display:block}
.subj li{display:flex;align-items:center;gap:2px;border-radius:4px}
.subj li:hover{background:var(--surface-2)}
.subj li a{flex:1;min-width:0;display:flex;gap:8px;padding:5px 6px 5px 10px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px}
.ck{display:flex;gap:1px;flex:none;padding-right:4px}
.ck label{display:flex;align-items:center;cursor:pointer;padding:2px}
.ck input{margin:0;width:15px;height:15px;cursor:pointer}
.ck input.r{accent-color:#2F6B4F} .ck input.v{accent-color:#6B4FA0}
.subj li.done-r a{color:var(--muted)}
.prog{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.legend-ck{display:flex;gap:12px;font-size:11.5px;color:var(--muted);padding:2px 12px 0}
.legend-ck i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar .marks{display:flex;gap:10px;font-size:12.5px;color:var(--muted)}
.bar .marks label{display:flex;align-items:center;gap:4px;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--surface)}
.bar .marks input{margin:0} .bar .marks .r{accent-color:#2F6B4F} .bar .marks .v{accent-color:#6B4FA0}
.card .bars{margin-top:10px;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.card .bars div{display:grid;grid-template-columns:62px 1fr 42px;gap:6px;align-items:center}
.card .bars span.t{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.card .bars span.t b{display:block;height:100%}
.subj li a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.subj li .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px}
.subj li a.active .n{color:var(--accent)}
.foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.foot button,.bar button,.bar a{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;font-size:12.5px;color:var(--muted);text-decoration:none}
.foot button:hover,.bar button:hover,.bar a:hover{color:var(--accent);border-color:var(--accent)}

/* main */
main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:46px}
.bar .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--muted)}
.bar .crumb b{color:var(--ink)}
#menu{display:none}
iframe{flex:1;width:100%;border:0;background:var(--ground)}
.hidden{display:none!important}

/* home */
#home{flex:1;overflow-y:auto;padding:32px 24px 80px}
#home .in{max-width:900px;margin:0 auto}
#home h1{font-size:clamp(26px,5vw,38px);margin:0 0 4px;line-height:1.1}
#home p.sub{color:var(--muted);margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:6px;padding:18px;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--c)}
.card h2{margin:0 0 4px;font-size:19px}
.card .meta{font-size:13px;color:var(--muted)}
.card ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}

@media (max-width:820px){
  aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.drawer aside{transform:none}
  #menu{display:inline-block}
  #home{padding:24px 16px 60px}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><a href="#"><small>IBPS SO · IT</small><strong>My Study Notes</strong></a></div>
  <input class="search" id="q" type="search" placeholder="Filter chapters…" autocomplete="off">
  <div class="legend-ck"><span><i style="background:#2F6B4F"></i>Read</span><span><i style="background:#6B4FA0"></i>Revised</span></div>
  <nav id="nav"></nav>
  <div class="foot"><button id="theme">Theme</button><button id="collapse">Collapse all</button></div>
</aside>
<main>
  <div class="bar">
    <button id="menu" aria-label="Menu">☰</button>
    <div class="crumb" id="crumb"><b>Home</b></div>
    <div class="marks hidden" id="marks"><label title="Mark this chapter as read"><input type="checkbox" class="r" id="mk-r">Read</label><label title="Mark this chapter as revised"><input type="checkbox" class="v" id="mk-v">Revised</label></div>
    <button id="prev" class="hidden">← Prev</button>
    <button id="next" class="hidden">Next →</button>
    <a id="newtab" class="hidden" target="_blank" rel="noopener">Open ↗</a>
  </div>
  <div id="home"><div class="in">
    <h1>My Study Notes</h1>
    <p class="sub">Pick a subject, or use the sidebar to jump straight to a chapter.</p>
    <div class="cards" id="cards"></div>
  </div></div>
  <iframe id="view" class="hidden" title="Notes"></iframe>
</main>

<script>
/* ============================================================

   To add a subject: drop its folder next to this file and add
   an entry below. `chapters` = [file name without .html, title].
   `group` = sidebar/home heading the entry sits under.
   ============================================================ */
var SUBJECTS = [

      ['20-Subnetting', 'Subnetting'],
      ['21-CIDR', 'Classless Addressing (CIDR)'],
      ['22-IPv4-Header', 'IPv4 Header'],
      ['23-IPv6-Header', 'IPv6 Header Format'],
      ['24-ARP-and-RARP', 'ARP and RARP'],

      ['29-TCP', 'TCP'],
      ['30-UDP', 'UDP'],
      ['31-TCP-Congestion-Control', 'TCP Congestion Control'],

    ]
  },

      ['04-Singly-Linked-List', 'Singly Linked List'],

    unit: 'months', numbered: false,
    /* Generated by Current-Affairs/_build/build.py — don't edit by hand. */
    chapters: [
      // ca:start
      ['2026-08-August-Class-1', 'August 2026 · Class 1'],
      ['2026-08-August-Class-2', 'August 2026 · Class 2'],

      ['2026-07-July-Class-1', 'July 2026 · Class 1'],

      ['2026-07-July-Class-3', 'July 2026 · Class 3'],
      ['2026-07-July-Class-4', 'July 2026 · Class 4'],
      ['2026-07-July-Class-5', 'July 2026 · Class 5'],
      ['2026-07-July-Class-6', 'July 2026 · Class 6']

    ]
  },
  {

    unit: 'classes', numbered: false,
    /* Generated by Banking-Awareness/_build/build.py — don't edit by hand. */

      // ba-alpha:start
      ['Class-01', 'Class 1 · Financial Inclusion, BC, Assets & Liability'],

      ['Class-03', 'Class 3 · Loans & Advances, Payments Bank & Small Finance Bank'],
      ['Class-04', 'Class 4 · History of Banking, Nationalisation & Mergers'],
      ['Class-05', 'Class 5 · Types of Banks & All India Financial Institutions'],

      // ba-alpha:end
    ]
  },
  {
    id: 'ba-beta', group: 'Current Affairs', sub: 'Banking Awareness', name: 'Beta', folder: 'Banking-Awareness/Beta', color: '#6B4FA0',
    unit: 'classes', numbered: false,
    chapters: [
      // ba-beta:start

    ]

];

(function(){
  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement, view = $('view'), nav = $('nav');
  var store = {
    get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var byId = {}; SUBJECTS.forEach(function(s){ byId[s.id] = s; });

  /* ---------- read / revised progress: { "<subject>/<file>": {r:1, v:1} } ---------- */
  var prog = {};
  try{ prog = JSON.parse(store.get('hub-progress') || '{}') || {}; }catch(e){ prog = {}; }
  function mark(key, kind){ return !!(prog[key] && prog[key][kind]); }
  function setMark(key, kind, on){
    var m = prog[key] || {};
    if (on) m[kind] = 1; else delete m[kind];
    if (m.r || m.v) prog[key] = m; else delete prog[key];
    store.set('hub-progress', JSON.stringify(prog));
    refreshMarks();
  }
  function counts(s){
    var r = 0, v = 0;
    s.chapters.forEach(function(c){ var k = s.id + '/' + c[0]; if (mark(k,'r')) r++; if (mark(k,'v')) v++; });
    return {r:r, v:v, n:s.chapters.length};
  }

  /* ---------- sidebar + home cards ---------- */
  var openSet = JSON.parse(store.get('hub-open') || '[]');
  var lastGroup = null, lastSub = null;
  function groupHead(s, cls){
    var h = '';
    if (s.group && s.group !== lastGroup){ lastGroup = s.group; lastSub = null; h += '<div class="' + cls + '">' + esc(s.group) + '</div>'; }
    if (s.sub && s.sub !== lastSub){ lastSub = s.sub; h += '<div class="' + cls + ' sub">' + esc(s.sub) + '</div>'; }
    return h;
  }
  nav.innerHTML = SUBJECTS.map(function(s){
    return groupHead(s, 'grp') + '<div class="subj' + (s.sub ? ' in' : '') + (openSet.indexOf(s.id) > -1 ? ' open' : '') + '" data-s="' + s.id + '">' +
      '<button type="button"><span class="dot" style="background:' + s.color + '"></span>' + esc(s.name) +
      '<span class="prog" data-p="' + s.id + '"></span><span class="chev">›</span></button><ol>' +
      '<li><a href="#' + s.id + '/index"><span class="n">★</span>Overview</a></li>' +
      s.chapters.map(function(c, i){
        var k = s.id + '/' + c[0];
        return '<li data-k="' + esc(k) + '"><a href="#' + k + '"><span class="n">' + (s.numbered === false ? '•' : i + 1) + '</span>' + esc(c[1]) + '</a>' +
          '<span class="ck"><label title="Read"><input type="checkbox" class="r" data-kind="r" aria-label="Read: ' + esc(c[1]) + '"></label>' +
          '<label title="Revised"><input type="checkbox" class="v" data-kind="v" aria-label="Revised: ' + esc(c[1]) + '"></label></span></li>';
      }).join('') + '</ol></div>';
  }).join('');

  lastGroup = null; lastSub = null;
  $('cards').innerHTML = SUBJECTS.map(function(s){
    return groupHead(s, 'grp-h') + '<a class="card" style="--c:' + s.color + '" href="#' + s.id + '/index"><h2>' + esc(s.name) + '</h2>' +
      '<div class="meta">' + (s.chapters.length || 'No') + ' ' + (s.unit || 'chapters') + (s.chapters.length ? '' : ' added yet') + '</div><ul>' +
      s.chapters.slice(0, 4).map(function(c){ return '<li>' + esc(c[1]) + '</li>'; }).join('') +
      (s.chapters.length > 4 ? '<li>…</li>' : '') + '</ul>' +
      (s.chapters.length ? '<div class="bars" data-b="' + s.id + '"></div>' : '') + '</a>';
  }).join('');

  nav.addEventListener('change', function(e){
    var cb = e.target, li = cb.closest('li[data-k]');
    if (li && cb.dataset.kind) setMark(li.dataset.k, cb.dataset.kind, cb.checked);
  });
  $('mk-r').onchange = function(){ if (curKey) setMark(curKey, 'r', this.checked); };
  $('mk-v').onchange = function(){ if (curKey) setMark(curKey, 'v', this.checked); };
  var curKey = null;
  function refreshMarks(){
    nav.querySelectorAll('li[data-k]').forEach(function(li){
      var k = li.dataset.k;
      li.querySelector('input.r').checked = mark(k,'r');
      li.querySelector('input.v').checked = mark(k,'v');
      li.classList.toggle('done-r', mark(k,'r'));
    });
    SUBJECTS.forEach(function(s){
      var c = counts(s), p = nav.querySelector('.prog[data-p="' + s.id + '"]'), b = document.querySelector('.bars[data-b="' + s.id + '"]');
      if (p) p.textContent = c.n ? (c.r + '/' + c.n) : '';
      if (p) p.title = c.r + ' read · ' + c.v + ' revised of ' + c.n;
      if (b) b.innerHTML = [['Read', c.r, '#2F6B4F'], ['Revised', c.v, '#6B4FA0']].map(function(x){
        return '<div><span>' + x[0] + '</span><span class="t"><b style="width:' + (c.n ? Math.round(100 * x[1] / c.n) : 0) + '%;background:' + x[2] + '"></b></span><span>' + x[1] + '/' + c.n + '</span></div>';
      }).join('');
    });
    $('mk-r').checked = !!curKey && mark(curKey,'r');
    $('mk-v').checked = !!curKey && mark(curKey,'v');
  }
  window.addEventListener('storage', function(e){
    if (e.key !== 'hub-progress') return;
    try{ prog = JSON.parse(e.newValue || '{}') || {}; }catch(err){ prog = {}; }
    refreshMarks();
  });

  function saveOpen(){
    store.set('hub-open', JSON.stringify([].map.call(nav.querySelectorAll('.subj.open'), function(e){ return e.dataset.s; })));
  }
  nav.addEventListener('click', function(e){
    var b = e.target.closest('.subj>button');
    if (b){ b.parentNode.classList.toggle('open'); saveOpen(); }
    if (e.target.closest('a')) document.body.classList.remove('drawer');
  });
  $('collapse').onclick = function(){ nav.querySelectorAll('.subj').forEach(function(e){ e.classList.remove('open'); }); saveOpen(); };

  /* ---------- filter ---------- */
  $('q').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    nav.querySelectorAll('.subj').forEach(function(sj){
      var any = false, subjHit = sj.querySelector('button').textContent.toLowerCase().indexOf(q) > -1;
      sj.querySelectorAll('li').forEach(function(li){
        var hit = !q || subjHit || li.textContent.toLowerCase().indexOf(q) > -1;
        li.style.display = hit ? '' : 'none'; any = any || hit;
      });
      sj.style.display = any ? '' : 'none';
      if (q && any) sj.classList.add('open');
    });
  });

  /* ---------- routing: #<subject>/<file> ---------- */
  function route(){
    var h = decodeURIComponent(location.hash.slice(1)), parts = h.split('/');
    var s = byId[parts[0]], file = parts[1] || 'index';
    nav.querySelectorAll('a.active').forEach(function(a){ a.classList.remove('active'); });
    if (!s){
      $('home').classList.remove('hidden'); view.classList.add('hidden');
      ['prev','next','newtab'].forEach(function(id){ $(id).classList.add('hidden'); });
      $('crumb').innerHTML = '<b>Home</b>'; document.title = 'My Study Notes';
      curKey = null; $('marks').classList.add('hidden'); refreshMarks();
      return;
    }
    var src = s.folder + '/' + file + '.html';
    if (view.dataset.cur !== src){
      // replace() avoids an extra back-button step for the frame on top of the hash change
      var first = !view.dataset.cur;
      view.dataset.cur = src;
      if (first) view.setAttribute('src', src);
      else try{ view.contentWindow.location.replace(new URL(src, location.href).href); }catch(e){ view.setAttribute('src', src); }
    }
    $('home').classList.add('hidden'); view.classList.remove('hidden');

    var idx = -1;
    s.chapters.forEach(function(c, i){ if (c[0] === file) idx = i; });
    var title = idx > -1 ? s.chapters[idx][1] : 'Overview';
    curKey = idx > -1 ? s.id + '/' + file : null;
    $('marks').classList.toggle('hidden', !curKey); refreshMarks();
    $('crumb').innerHTML = esc((s.sub ? s.sub + ' · ' : '') + s.name) + ' › <b>' + esc(title) + '</b>';
    document.title = title + ' · ' + (s.sub ? s.sub + ' ' : '') + s.name;

    var sj = nav.querySelector('.subj[data-s="' + s.id + '"]');
    sj.classList.add('open');
    var link = sj.querySelector('a[href="#' + s.id + '/' + file + '"]');
    if (link){ link.classList.add('active'); link.scrollIntoView({block:'nearest'}); }

    setStep('prev', s, idx - 1, idx > -1 ? s.chapters[idx - 1] : null);
    setStep('next', s, idx + 1, idx > -1 ? s.chapters[idx + 1] : s.chapters[0]);
    $('newtab').href = src; $('newtab').classList.remove('hidden');
  }
  function setStep(id, s, i, ch){
    var b = $(id);
    if (!ch){ b.classList.add('hidden'); return; }
    b.classList.remove('hidden'); b.title = ch[1];
    b.onclick = function(){ location.hash = s.id + '/' + ch[0]; };
  }
  window.addEventListener('hashchange', route);

  /* Note pages include assets/embed.js, which talks to the hub via postMessage
     (works on file:// too, where the hub can't read the frame directly). */
  function hashFor(href){
    var p = decodeURIComponent(String(href).split('#')[0]), m = p.match(/\/([^\/]+)\.html$/), hit = null;
    if (!m) return null;
    // folder may be nested (Banking-Awareness/Alpha): match the path's tail
    SUBJECTS.forEach(function(s){
      var tail = '/' + s.folder + '/' + m[1] + '.html';
      if (p.slice(-tail.length) === tail) hit = s.id + '/' + m[1];
    });
    return hit;
  }
  window.addEventListener('message', function(e){
    if (e.source !== view.contentWindow) return;
    var d = e.data || {}, h;
    if (d.notesHub === 'nav'){
      h = hashFor(d.href);
      if (h) location.hash = h; else window.open(d.href, '_blank');
    } else if (d.notesHub === 'loaded'){
      sendTheme();
      h = hashFor(d.href);
      if (h && location.hash.slice(1) !== h){
        var p = h.split('/'); view.dataset.cur = byId[p[0]].folder + '/' + p[1] + '.html';
        history.replaceState(null, '', '#' + h); route();
      }
    }
  });

  /* ---------- theme (hub decides; pushed into the note page) ---------- */
  function currentTheme(){
    return root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function sendTheme(){
    try{ view.contentWindow.postMessage({ notesHub: 'theme', theme: currentTheme() }, '*'); }catch(e){}
  }
  var saved = store.get('hub-theme'); if (saved) root.setAttribute('data-theme', saved);
  $('theme').onclick = function(){
    var nxt = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nxt);
    ['hub-theme', 'os-notes-theme', 'notes-theme'].forEach(function(k){ store.set(k, nxt); });
    sendTheme();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sendTheme);

  $('menu').onclick = function(){ document.body.classList.toggle('drawer'); };
  route();
})();
</script>
</body>
