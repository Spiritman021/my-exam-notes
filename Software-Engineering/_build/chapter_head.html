<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CN Application Layer Notes</title>
<script src="../assets/embed.js"></script>
<style>
:root{
  --ground:#F4F7F8; --surface:#FFFFFF; --surface-2:#EDF2F4;
  --ink:#0E171D; --muted:#5C6E79; --line:#D8E1E6;
  --accent:#0B5E8A; --accent-soft:#E2EEF5;
  --lec:#4C6E5D; --lec-bg:#E6EEE9;
  --add:#6B4FA0; --add-bg:#EEE8F6;
  --warn:#8A5A12; --warn-bg:#F6EEDF;
  --alert:#A8501C; --alert-bg:#F6EAE1;
  --ok:#2F6B4F; --bad:#A33A3A;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1317; --surface:#131E24; --surface-2:#1A272E;
    --ink:#E4ECF1; --muted:#8AA0AC; --line:#2A3B44;
    --accent:#4FA6DC; --accent-soft:#152A38;
    --lec:#82AB92; --lec-bg:#182620;
    --add:#B39DDB; --add-bg:#221C30;
    --warn:#D9A441; --warn-bg:#2A2113;
    --alert:#DE8A55; --alert-bg:#2A1E16;
    --ok:#7FB79A; --bad:#E07A7A;
  }
}
:root[data-theme="dark"]{
  --ground:#0C1317; --surface:#131E24; --surface-2:#1A272E;
  --ink:#E4ECF1; --muted:#8AA0AC; --line:#2A3B44;
  --accent:#4FA6DC; --accent-soft:#152A38;
  --lec:#82AB92; --lec-bg:#182620;
  --add:#B39DDB; --add-bg:#221C30;
  --warn:#D9A441; --warn-bg:#2A2113;
  --alert:#DE8A55; --alert-bg:#2A1E16;
  --ok:#7FB79A; --bad:#E07A7A;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 96px}
a{color:var(--accent)}
button.themer{position:fixed;top:12px;right:12px;font:12px var(--body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;z-index:5}

/* cover */
.cover{margin:28px 0 24px;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:6px}
.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cover h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:10px 0 6px}
.cover .sub{color:var(--muted);margin:0 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .l1::before{background:var(--lec)} .legend .l2::before{background:var(--add)}
.legend .l3::before{background:var(--warn)} .legend .l4::before{background:var(--alert)}

/* toc */
nav.toc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 20px;margin-bottom:28px}
nav.toc h2{margin:0 0 8px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.toc ol{columns:2 300px;margin:0;padding-left:0;list-style:none;font-size:14.5px}
nav.toc li{break-inside:avoid;padding:2px 0}
nav.toc a{text-decoration:none;color:var(--ink)} nav.toc a:hover{color:var(--accent)}
nav.toc .n{color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block;min-width:38px}
nav.toc .x{font-size:11px;color:var(--add);border:1px solid var(--add);border-radius:3px;padding:0 4px;margin-left:4px}

/* chapter + sections */
.chapter{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:40px 0 0}
h2.ch{font-size:clamp(24px,4vw,32px);margin:4px 0 12px;line-height:1.15}
section{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin:18px 0}
section h3{font-size:21px;margin:0 0 10px;line-height:1.25}
section h3 .n{color:var(--accent);margin-right:8px}
section h4{font-size:16.5px;margin:18px 0 6px}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;vertical-align:3px;margin-left:8px;padding:1px 6px;border-radius:3px;color:var(--add);border:1px solid var(--add)}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}
li{margin:3px 0}
.def{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 4px 4px 0;margin:10px 0}
.def b:first-child{color:var(--accent)}

/* callouts */
.box{border-radius:5px;padding:10px 14px;margin:12px 0;border:1px solid}
.box .t{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.lec{background:var(--lec-bg);border-color:var(--lec)} .lec .t{color:var(--lec)}
.add{background:var(--add-bg);border-color:var(--add)} .add .t{color:var(--add)}
.trap{background:var(--warn-bg);border-color:var(--warn)} .trap .t{color:var(--warn)}
.alert{background:var(--alert-bg);border-color:var(--alert)} .alert .t{color:var(--alert)}
.num{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:12px 16px;margin:14px 0}
.num .t{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:4px}
.formula{font-family:var(--code);font-size:14.5px;background:var(--surface);border:1px dashed var(--line);padding:8px 12px;border-radius:4px;margin:8px 0;overflow-x:auto;white-space:pre}

/* tables */
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600}

/* figures */
figure{margin:16px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
svg text{fill:var(--ink);font-family:var(--body);font-size:13px}
svg .mut{fill:var(--muted);font-size:11.5px}
svg .b{font-weight:700}
svg .bx{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
svg .ac{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg .gr{fill:var(--lec-bg);stroke:var(--lec);stroke-width:1.5}
svg .or{fill:var(--alert-bg);stroke:var(--alert);stroke-width:1.5}
svg .pu{fill:var(--add-bg);stroke:var(--add);stroke-width:1.5}
svg .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
svg .lna{stroke:var(--accent);stroke-width:2;fill:none}
svg .dash{stroke-dasharray:5 4}
svg .hard{stroke:var(--bad);stroke-width:2.5;fill:none}
svg .soft{stroke:var(--ok);stroke-width:2.5;fill:none}
svg .ah{fill:var(--muted)} svg .aha{fill:var(--accent)}

/* rapid revision */
.rapid{background:var(--surface);border:2px solid var(--accent);border-radius:6px;padding:18px 22px;margin:28px 0}
.rapid h3{margin:0 0 8px;color:var(--accent)}
.rapid li{margin:5px 0}
.end{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px;margin-top:30px}
code{font-family:var(--code);font-size:.92em;background:var(--surface-2);padding:1px 4px;border-radius:3px}

.topnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 0;font-size:14px}
.topnav a{text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:4px}
.topnav a:hover{border-color:var(--accent)}
.topnav .off{color:var(--muted);border:1px dashed var(--line);padding:5px 10px;border-radius:4px}
@media (max-width:600px){section{padding:16px 14px} .cover{padding:20px 16px}}
@media print{
  button.themer{display:none}
  body{background:#fff;font-size:12.5px}
  section,.rapid,.cover,nav.toc{break-inside:auto;border-color:#bbb}
  figure,.box,.num,table{break-inside:avoid}
  section h3{break-after:avoid}
}
</style>
</head>
